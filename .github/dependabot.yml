version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /hello-world
    schedule:
      interval: weekly
    groups:
      gomod-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /hello-world
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: terraform
    directories:
      - /terraform-ci
      - /terraform
      - /terraform/aws
    schedule:
      interval: weekly
    groups:
      terraform-minor-patch:
        update-types:
          - minor
          - patch
